
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oratify: The Interview Arcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'cyber-black': '#050505',
              'cyber-dark': '#0f1115',
              'cyber-gray': '#1a1d24',
              'neon-cyan': '#00f0ff',
              'neon-green': '#00ff9f',
              'neon-pink': '#ff0055',
              'neon-purple': '#bc13fe',
              'hologram': 'rgba(0, 240, 255, 0.1)',
            },
            fontFamily: {
              'header': ['"Orbitron"', 'sans-serif'],
              'body': ['"Rajdhani"', 'sans-serif'],
            },
            boxShadow: {
              'neon-cyan': '0 0 10px rgba(0, 240, 255, 0.5)',
              'neon-green': '0 0 10px rgba(0, 255, 159, 0.5)',
              'neon-pink': '0 0 10px rgba(255, 0, 85, 0.5)',
              'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.37)',
            },
            animation: {
              'scanline': 'scanline 4s linear infinite',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              scanline: {
                '0%': { transform: 'translateY(-100%)' },
                '100%': { transform: 'translateY(100%)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #050505;
        color: #e0e0e0;
        font-family: 'Rajdhani', sans-serif;
        text-shadow: 0 0 1px rgba(0,0,0,0.5); /* Slight crispness */
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f1115;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00f0ff;
      }
      
      .glass-panel {
        background: rgba(15, 17, 21, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      
      /* CHROMATIC ABERRATION TEXT */
      .chromatic-text {
        position: relative;
        z-index: 1;
      }
      .chromatic-text::before,
      .chromatic-text::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0.8;
      }
      .chromatic-text::before {
        color: #ff00de;
        z-index: -1;
        transform: translate(-1px, 0);
      }
      .chromatic-text::after {
        color: #00f0ff;
        z-index: -2;
        transform: translate(1px, 0);
      }

      /* GLOBAL CRT EFFECT: Scanlines + Vignette */
      .scanline-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        
        /* Scanlines */
        background: repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 2px,
          rgba(0, 0, 0, 0.15) 3px,
          rgba(0, 0, 0, 0.15) 4px
        );
        background-size: 100% 4px;

        /* Vignette (Curved Screen Effect) */
        box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
      }

      /* Subtle Flicker */
      .scanline-overlay::after {
        content: " ";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: rgba(18, 16, 16, 0.02);
        opacity: 0;
        z-index: 2;
        pointer-events: none;
        animation: flicker 0.15s infinite;
      }

      @keyframes flicker {
        0% { opacity: 0.02; }
        50% { opacity: 0.05; }
        100% { opacity: 0.02; }
      }

      @keyframes grid-scroll {
        0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
        100% { transform: perspective(500px) rotateX(60deg) translateY(40px); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.32.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
